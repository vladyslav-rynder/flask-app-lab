{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <section class="card p-4 shadow-sm">
            <h2 class="mb-4">Зв'яжіться зі мною</h2>

            <div class="mb-4">
                <p><strong>Email:</strong> vladyslav.rynder.dev@gmail.com </p>
                <p><strong>Telegram:</strong> @VladRynder</p>
            </div>

            <hr>

            <h4 class="mb-3">Форма для відправлення повідомлення</h4>
            <form onsubmit="event.preventDefault(); alert('Повідомлення надіслано (заглушка)!');">
                <div class="mb-3">
                    <label for="nameInput" class="form-label">Ваше ім'я</label>
                    <input type="text" class="form-control" id="nameInput" required placeholder="Іван Іванов">
                </div>
                <div class="mb-3">
                    <label for="emailInput" class="form-label">Ваш Email</label>
                    <input type="email" class="form-control" id="emailInput" required placeholder="name@example.com">
                </div>
                <div class="mb-3">
                    <label for="msgInput" class="form-label">Повідомлення</label>
                    <textarea class="form-control" id="msgInput" rows="4" required placeholder="Текст вашого повідомлення..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Відправити</button>
            </form>
        </section>
    </div>
</div>
{% endblock %}
