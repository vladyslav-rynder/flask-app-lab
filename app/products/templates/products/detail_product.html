{% extends 'base.html' %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm p-4">
            <h2 class="text-primary mb-3">{{ product.name }}</h2>
            <h4 class="text-success mb-3">Ціна: ${{ product.price }}</h4>
            <hr>
            <p class="lead mb-4"><strong>Опис:</strong> {{ product.content }}</p>
            <div>
                <a href="{{ url_for('products.list_products') }}" class="btn btn-secondary">Назад до каталогу</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
