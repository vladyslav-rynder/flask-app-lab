{% extends 'base.html' %}

{% block title %}Список товарів{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4">Каталог товарів</h2>
        <div class="row row-cols-1 row-cols-md-3 g-4">
            {% for prod in products %}
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <h4 class="card-title">{{ prod.name }}</h4>
                        <h6 class="text-success fw-bold mb-3">${{ prod.price }}</h6>
                        <p class="card-text text-muted flex-grow-1">{{ prod.content }}</p>
                        <a href="{{ url_for('products.product_detail', product_id=prod.id) }}" class="btn btn-outline-primary mt-auto">Детальніше</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
