{% extends 'base.html' %}

{% block title %}Profile{% endblock %}

{% block content %}
<div class="card p-4 shadow-sm bg-primary text-white mb-4">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h2>Ласкаво просимо до сторінки {{ username }}!</h2>
            <p class="mb-0">Тут ви можете отримати інформацію та вийти з системи</p>
        </div>
    </div>
    <div class="mt-3">
        <a href="{{ url_for('users.logout') }}" class="btn btn-danger">Вийти</a>
    </div>
</div>
{% endblock %}
