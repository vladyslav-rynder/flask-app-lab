{% extends "base.html" %}
{% block title %}Усі пости{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('.static', filename='css/posts.css') }}">
<h1 class="myclass">Articles</h1>

<div class="container mt-5">
  <form action="{{ url_for('posts.create_post') }}" class="mb-4" method="GET">
    <button type="submit" class="btn btn-primary">Add post</button>
  </form>

  <div class="row">
    {% for post in posts %}
    <div class="col-md-4 mb-3">
      <div class="card h-100">
        <img src="{{ url_for('.static', filename='img/postImg.png') }}" class="card-img-top" height="150px" alt="default image">
        <div class="card-body">
          <h5 class="card-title">{{ post.title }}</h5>
          <p class="card-text">Post ID: {{ post.id }}</p>
          <p class="card-text">{{ post.content[:100] }}...</p>
          <a href="{{ url_for('posts.detail_post', id=post.id) }}" class="btn btn-info btn-sm">View Post</a>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
