{% extends "base.html" %}
{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="card-title">{{ post.title }}</h1>
                <h6 class="card-subtitle mb-2 text-muted">Автор: {{ post.author }} | Створено: {{ post.posted }}</h6>
                <p class="badge bg-secondary">{{ post.category }}</p>

                <hr>
                <p class="card-text" style="white-space: pre-wrap;">{{ post.content }}</p>

                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('posts.list_posts') }}" class="btn btn-outline-secondary">Назад до списку</a>

                    <div>
                        <a href="{{ url_for('posts.update_post', id=post.id) }}" class="btn btn-warning btn-sm">Редагувати</a>

                        <form action="{{ url_for('posts.delete_post', id=post.id) }}" method="POST" class="d-inline" onsubmit="return confirm('Ви впевнені, що хочете видалити цей пост?');">
                            <button type="submit" class="btn btn-danger btn-sm">Видалити</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
